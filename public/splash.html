<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <title>Orvian</title>
    <style>
      /* Same values as src/ui/styles/tokens.css (this page is standalone) */
      :root {
        color-scheme: dark;
        --bg: #080305;
        --surface-2: #181116;
        --text: #e2dee1;
        --text-muted: #a89ea5;
        --accent: #b05cb2;
        --font: 'Segoe UI Variable Display', 'Segoe UI', system-ui, sans-serif;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        background-image: radial-gradient(70% 50% at 50% 0%, rgba(176, 92, 178, 0.2), transparent 70%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: var(--bg);
        color: var(--text);
        font-family: var(--font);
        -webkit-app-region: drag;
        user-select: none;
        overflow: hidden;
      }
      img { width: 96px; height: 96px; filter: drop-shadow(0 14px 32px rgba(176, 92, 178, 0.35)); }
      h1 { margin: 12px -0.32em 0 0; font-size: 22px; line-height: 30px; font-weight: 700; letter-spacing: 0.32em; text-transform: uppercase; }
      p { margin: 0; min-height: 20px; font-size: 14px; color: var(--text-muted); }
      .track { width: 220px; height: 3px; margin-top: 12px; overflow: hidden; border-radius: 3px; background: var(--surface-2); }
      .fill { width: 100%; height: 100%; background: var(--accent); transform: scaleX(0); transform-origin: left; transition: transform 240ms cubic-bezier(0.22, 1, 0.36, 1); }
      @media (prefers-reduced-motion: reduce) { .fill { transition: none; } }
    </style>
  </head>
  <body>
    <img src="logo-256.png" alt="" draggable="false" />
    <h1>Orvian</h1>
    <p id="status" role="status">Iniciando…</p>
    <div class="track" role="progressbar" aria-label="Carga del launcher" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="track">
      <div class="fill" id="fill"></div>
    </div>
    <script>
      // Called by the main process with what the launcher is really doing
      window.setSplash = function (label, fraction) {
        var clamped = Math.min(1, Math.max(0, fraction));
        document.getElementById('status').textContent = label;
        document.getElementById('fill').style.transform = 'scaleX(' + clamped + ')';
        document.getElementById('track').setAttribute('aria-valuenow', String(Math.round(clamped * 100)));
      };
    </script>
  </body>
</html>
